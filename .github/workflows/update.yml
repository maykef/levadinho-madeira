name: Update trail status

on:
  schedule:
    # GitHub starts scheduled runs late: measured 2026-09-03..27, runs cron'd for 04:00 UTC
    # started 4.2-5.9 h late (median 5.2 h). This one starts ~05:15-06:55 UTC.
    # TODO: move to an exact trigger — update live at 06:00 Madeira with 05:55 weather
    # (a workflow_dispatch fired on time starts within seconds; the cron can't do that).
    - cron: "0 1 * * *"
  workflow_dispatch: {}     # lets you run it manually from the GitHub app anytime

permissions:
  contents: write

concurrency:                # never let two runs race each other's push
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update status from the IFCN warnings page + IPMA weather
        run: python scripts/update_status.py

      # Funchal page data (2026-10-08): events, market fair, lidos, IPMA, last buses -> funchal.json + the page's
      # static event / last-bus lists. Separate and non-blocking: a broken Funchal source never stops the trail board.
      - name: Update Funchal data (non-blocking)
        continue-on-error: true
        run: python scripts/update_funchal.py

      - name: Commit and push if changed
        run: |
          git config user.name "levadinho-bot"
          git config user.email "actions@users.noreply.github.com"
          # status.json + sitemap + the AI feeds (llms*.txt, RSS, daily history), plus any page whose dateModified or STATIC-STATUS line changed
          # (every *.html except the bot's own files).
          git add status.json funchal.json sitemap.xml llms.txt llms-full.txt trail-status.xml history/status-daily.jsonl
          git add -A -- '*.html' ':(exclude)bot/**'
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily status update $(date -u +%F)"
          # main may have moved during the run (3 push rejections in Sept): rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      # IndexNow (LLM audit item C, 2026-10-05): tell Bing & co. which pages really changed this run
      # (update_status.py wrote them to indexnow_urls.txt; the weather reading doesn't count). Wait until
      # GitHub Pages serves this run's status.json, so the engines fetch the new pages. Never fails the run.
      - name: Ping IndexNow with the changed pages
        if: success()
        continue-on-error: true
        run: |
          test -s indexnow_urls.txt || { echo "IndexNow: nothing changed"; exit 0; }
          want=$(python -c "import json;print(json.load(open('status.json'))['stamp'])")
          for i in $(seq 1 20); do
            live=$(curl -fsS "https://levadinho-madeira.com/status.json?nocache=$RANDOM" | python -c "import json,sys;print(json.load(sys.stdin)['stamp'])" || true)
            [ "$live" = "$want" ] && break
            sleep 30
          done
          [ "$live" = "$want" ] || { echo "IndexNow: Pages not updated after 10 min, skipped"; exit 0; }
          python scripts/indexnow.py
